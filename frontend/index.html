<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeenuRaksha — Pond early warning</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b4f6c' d='M12 2s7 7.6 7 12.5A7 7 0 0 1 5 14.5C5 9.6 12 2 12 2Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top-bar">
    <div class="brand">
      <span class="app-name" data-i18n="appName">MeenuRaksha</span>
      <span class="tagline" data-i18n="tagline">Pond water early warning</span>
    </div>
    <div class="language-toggle" role="group" aria-label="Language / ಭಾಷೆ">
      <button type="button" data-lang="kn" lang="kn">ಕನ್ನಡ</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
  </header>

  <main>
    <!-- Always visible: everything on this page comes from the simulator. -->
    <p class="simulated-banner" id="simulated-banner">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-6h2v6Zm0-8h-2V7h2v2Z"/></svg>
      <span><strong id="simulated-label">Simulated data</strong> — <span data-i18n="simulatedNote">not a real pond. For demonstration only.</span></span>
    </p>

    <section class="controls" aria-label="Demo controls">
      <label>
        <span data-i18n="pond">Pond</span>
        <select id="station">
          <option value="station1" data-i18n="pond1">Pond 1</option>
          <option value="station2" data-i18n="pond2">Pond 2</option>
          <option value="station3" data-i18n="pond3">Pond 3</option>
        </select>
      </label>
      <label>
        <span data-i18n="scenario">Scenario</span>
        <select id="scenario">
          <option value="normal" data-i18n="scenarioNormal">Normal day</option>
          <option value="oxygen_crash" data-i18n="scenarioCrash">Night oxygen crash</option>
        </select>
      </label>
      <button type="button" class="button-primary" id="restart" data-i18n="restart">Restart</button>
      <button type="button" class="button-secondary" id="pause" data-i18n="pause">Pause</button>
    </section>

    <p class="sim-clock"><span data-i18n="simTime">Simulated time</span>: <strong id="sim-time">—</strong></p>

    <section id="status" class="status-banner status-unknown" role="status" aria-live="polite">
      <span class="status-icon" id="status-icon" aria-hidden="true"></span>
      <div>
        <p class="status-level" id="status-level" data-i18n="connecting">Connecting…</p>
        <p class="status-summary" id="status-summary"></p>
      </div>
    </section>

    <section class="card" aria-labelledby="ttd-title">
      <h2 id="ttd-title" data-i18n="ttdTitle">Time until danger</h2>
      <p id="ttd-message" class="ttd-message">—</p>
    </section>

    <section aria-labelledby="readings-title">
      <h2 id="readings-title" data-i18n="readingsTitle">Latest readings</h2>
      <div class="readings" id="readings"></div>
    </section>

    <p class="sensor-errors" id="sensor-errors" hidden></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
