<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>AquaNexus sensor kit wiring (proposed)</title>
<desc>Solar panel charges an 18650 pack through a CN3791 charger. The pack powers a 3.3 V regulator for the ESP32, a switched 12 V boost for the DO probe, and the A7670C 4G modem. The ESP32 reads an optical DO probe over isolated RS485, a DS18B20 on GPIO15, and a pH probe through an isolator and ADS1115 ADC on I2C.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
