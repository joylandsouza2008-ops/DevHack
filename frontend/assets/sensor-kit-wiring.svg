a(35,188,208,0.10)" stroke="#88cce6" stroke-width="1"/><text x="555.0" y="79" text-anchor="middle" font-size="14" font-weight="600" fill="#def0f8">Isolated RS485</text><text x="555.0" y="97" text-anchor="middle" font-size="12" fill="#9fb8c8">TTL to Modbus</text><rect x="470" y="130" width="170" height="52" rx="8" fill="rgba(35,188,208,0.10)" stroke="#88cce6" stroke-width="1"/><text x="555.0" y="149" text-anchor="middle" font-size="14" font-weight="600" fill="#def0f8">Optical DO probe</text><text x="555.0" y="167" text-anchor="middle" font-size="12" fill="#9fb8c8">SEN0680, 12 V</text><rect x="470" y="200" width="170" height="52" rx="8" fill="rgba(35,188,208,0.10)" stroke="#88cce6" stroke-width="1"/><text x="555.0" y="219" text-anchor="middle" font-size="14" font-weight="600" fill="#def0f8">DS18B20 temp</text><text x="555.0" y="237" text-anchor="middle" font-size="12" fill="#9fb8c8">4.7k pull-up to 3V3</text><rect x="470" y="270" width="170" height="52" rx="8" fill="rgba(35,188,208,0.10)" stroke="#88cce6" stroke-width="1"/><text x="555.0" y="289" text-anchor="middle" font-size="14" font-weight="600" fill="#def0f8">ADS1115 ADC</text><text x="555.0" y="307" text-anchor="middle" font-size="12" fill="#9fb8c8">A0 pH, A1 battery</text><rect x="470" y="340" width="170" height="52" rx="8" fill="rgba(35,188,208,0.10)" stroke="#88cce6" stroke-width="1"/><text x="555.0" y="359" text-anchor="middle" font-size="14" font-weight="600" fill="#def0f8">pH isolator</text><text x="555.0" y="377" text-anchor="middle" font-size="12" fill="#9fb8c8">DFR0504</text><rect x="470" y="410" width="170" height="52" rx="8" fill="rgba(35,188,208,0.10)" stroke="#88cce6" stroke-width="1"/><text x="555.0" y="429" text-anchor="middle" font-size="14" font-weight="600" fill="#def0f8">pH probe</text><text x="555.0" y="447" text-anchor="middle" font-size="12" fill="#9fb8c8">SEN0169-V2</text><rect x="250" y="60" width="180" height="402" rx="12" fill="rgba(35,188,208,0.10)" stroke="#23bcd0" stroke-width="1.5"/