# AquaNexus — Safe / Warning / Danger thresholds for Indian major carp ponds
#
# This is the ONLY place threshold numbers live. Change a number here and the
# classifier (backend/risk_classifier.py) picks it up — no code changes needed.
# Full table with sources: docs/thresholds.md
#
# How a parameter is graded:
#   1. If the reading is inside the [*.safe] range     -> Safe
#   2. Otherwise, if it is inside the [*.warning] range -> Warning
#   3. Otherwise                                        -> Danger
# A range can use:
#   min   = lowest allowed value (the value itself is allowed)
#   max   = highest allowed value (the value itself is allowed)
#   below = value must be LESS than this (the value itself is NOT allowed)
# A range with no limits ({}) accepts everything — that is how a parameter
# with no Danger level (nitrate) is written.
#
# Overall pond risk = the worst level among parameters with use_for_risk = true.
#
# Source key (see docs/thresholds.md): S = taken directly from a source,
# J = our judgement, anchored to the sources.

[dissolved_oxygen]
unit = "mg/L"
use_for_risk = true
safe    = { min = 5.0 }        # S: FAO "preferred at least 5 mg/l"; TNAU "5 mg/l to saturation"
warning = { min = 3.0 }        # S: FAO carp "minimum DO level: 3 mg/l"
plausible = { min = 0.1, max = 30.0 }   # J: exactly 0 or above 30 = sensor fault

[ph]
unit = ""
use_for_risk = true
safe    = { min = 6.5, max = 8.5 }   # S: FAO "6.5 to 8.5 … most suitable for pond fish production"
warning = { min = 5.5, max = 9.5 }   # J: FAO lethal limits are <4.5 and >=11; we warn earlier
plausible = { min = 2.0, max = 12.0 }

[temperature]
unit = "°C"
use_for_risk = true
safe    = { min = 25.0, max = 32.0 }    # S: FAO catla "grows best at 25–32 °C"
warning = { min = 20.0, below = 35.0 }  # J: below FAO "dangerous" 36 °C for carp
plausible = { min = 5.0, max = 45.0 }   # J: 0 °C readings in the dataset are sensor faults

[ammonia]
# The sensor reports TOTAL ammonia. Only the un-ionised part (NH3) is toxic,
# so the classifier converts total -> NH3 using pH and temperature
# (Emerson et al. 1975) before comparing with these limits.
unit = "mg/L NH3"
input_unit = "mg/L total ammonia"
use_for_risk = true
safe    = { below = 0.02 }     # S: TNAU optimum NH3 0.02–0.05 mg/l
warning = { max = 0.05 }       # S: TNAU upper limit. Cautious option: 0.035 (catla LC50, Tilak et al. 2002)
plausible = { min = 0.0, max = 20.0 }   # checked on the TOTAL ammonia reading

[nitrate]
# Sensor reports nitrate as NO3 (ppm = mg/L). Limits are in NO3-N.
# NO3 -> NO3-N: multiply by 14.007 / 62.004 = 0.2259
unit = "mg/L NO3-N"
input_unit = "mg/L NO3"
input_to_nitrogen_factor = 0.2259
use_for_risk = true
safe    = { below = 10.0 }     # S: Camargo et al. 2005, 10 mg NO3-N/L "can adversely affect" fish long-term
warning = {}                   # J: no Danger level; catla 24 h LC50 is ~1,480 mg/L (Tilak et al. 2002)
plausible = { min = 0.0, max = 500.0 }  # checked on the NO3 reading

[time_to_danger]
# "Time until danger": if dissolved oxygen has been falling, estimate when it
# reaches the Danger level (dissolved_oxygen.warning.min above, 3 mg/L), by
# fitting a straight line through the recent readings. All values: J.
window_hours = 2.0          # look at the last 2 hours of readings
min_span_hours = 1.0        # ... which must cover at least 1 hour
min_readings = 4            # ... with at least 4 readings
min_fall_per_hour = 0.3     # slower falls (mg/L per hour) count as "not falling"
min_r_squared = 0.6         # how well the readings follow a straight line (0–1). Below this the
                            # "fall" is just readings jumping around (sensor noise), not a trend
max_hours_ahead = 6.0       # don't predict further ahead than this

[turbidity]
# Shown to farmers as information only. Sources give limits in Secchi-disc
# centimetres (40–60 cm best), but the sensor reports a different unit
# (probably NTU), and the two cannot be converted.
unit = "NTU"
use_for_risk = false
plausible = { min = 0.0, max = 1000.0 }

# ---------------------------------------------------------------------------
# Tonight's oxygen crash risk, from the weather forecast (backend/weather.py).
# Not a pond reading: these rate the WEATHER that is known to cause night-time
# oxygen crashes. Each condition that is met is one "risk factor":
#   0 factors -> Low,  1 factor -> Medium,  2 or 3 factors -> High
# The causes are sourced (FAO, UF/IFAS); the cut-off numbers are our judgement.
# Full explanation: docs/night_crash.md
[night_crash]
cloudy_day_min_cloud_pct = 75   # J: mean cloud cover 06:00-18:00 before tonight at or above this = "cloudy day"
still_night_max_wind_kmh = 7    # J: mean wind 18:00-06:00 below this = "still night" (Beaufort "light breeze" starts at 4 knots = 7 km/h)
warm_night_min_temp_c    = 28   # J: mean air temp 18:00-06:00 at or above this = "warm night"
